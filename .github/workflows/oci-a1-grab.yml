name: OCI A1 Instance Auto Grab

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '30 4 * * *'
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'
    - cron: '30 6 * * *'
    - cron: '0 7 * * *'
    - cron: '30 7 * * *'
    - cron: '0 8 * * *'
    - cron: '30 8 * * *'
    - cron: '0 9 * * *'
    - cron: '30 9 * * *'
    - cron: '0 10 * * *'
    - cron: '30 10 * * *'
    - cron: '0 11 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  grab-a1-instance:
    runs-on: ubuntu-latest

    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}

    steps:
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-oci-cli-${{ runner.os }}

      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          fingerprint=${OCI_CLI_FINGERPRINT}
          tenancy=${OCI_CLI_TENANCY}
          region=${OCI_CLI_REGION}
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config
          oci iam region list --output table

      - name: Check and Create A1 Instance
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          set +e

          echo "=== 检查现有 A1 实例（4核/24GB）==="

          ALL_A1=$(oci compute instance list \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --lifecycle-state "RUNNING" \
            --all \
            2>&1)

          COUNT=$(echo "$ALL_A1" | jq '[.data[] | select(.shape == "VM.Standard.A1.Flex") | select(."shape-config".ocpus >= 4)] | length' 2>/dev/null)

          if [ "$COUNT" -gt "0" ] 2>/dev/null; then
            echo "已有正确配置的 A1 实例（4核以上）在运行，无需创建。"
            exit 0
          fi

          echo "未发现符合条件的 A1 实例，开始尝试三个 AD..."

          SSH_KEY=$(echo "$OCI_SSH_PUBLIC_KEY" | tr -d '\n\r')
          METADATA_JSON="{\"ssh_authorized_keys\": \"${SSH_KEY}\"}"

          try_create() {
            local AD="$1"
            echo "--- 尝试 AD: $AD ---"

            CREATE_RESULT=$(oci compute instance launch \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --availability-domain "$AD" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus": 4, "memory-in-gbs": 24}' \
              --image-id "$OCI_IMAGE_ID" \
              --subnet-id "$OCI_SUBNET_ID" \
              --assign-public-ip true \
              --metadata "$METADATA_JSON" \
              --display-name "A1-Auto-Grabbed" \
              2>&1)

            LIFECYCLE=$(echo "$CREATE_RESULT" | jq -r '.data["lifecycle-state"] // empty' 2>/dev/null)

            if [ -n "$LIFECYCLE" ]; then
              INSTANCE_ID=$(echo "$CREATE_RESULT" | jq -r '.data.id' 2>/dev/null)
              echo "✅ 实例创建成功！AD: $AD"
              echo "ID: $INSTANCE_ID"
              echo "状态: $LIFECYCLE"
              return 0
            else
              ERROR_CODE=$(echo "$CREATE_RESULT" | jq -r '.code // empty' 2>/dev/null)
              ERROR_MSG=$(echo "$CREATE_RESULT" | jq -r '.message // empty' 2>/dev/null)
              echo "❌ AD $AD 失败"
              echo "错误码: $ERROR_CODE"
              echo "原因: $ERROR_MSG"
              return 1
            fi
          }

          try_create "AinZ:US-ASHBURN-AD-1" && exit 0
          try_create "AinZ:US-ASHBURN-AD-2" && exit 0
          try_create "AinZ:US-ASHBURN-AD-3" && exit 0

          echo "三个 AD 都失败，下次运行会重试。"
          exit 0
